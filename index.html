<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="龍洞攀岩路線與 Bolt 資訊，離線可用。資料由臺灣戶外攀岩協會（TOCC）固定點更新計畫維護。" />
    <meta name="theme-color" content="#1f4e5f" />
    <!-- 在 LINE、Facebook 等貼上連結時的預覽卡片；路線網址用 # 區分，預覽一律顯示網站本身 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="龍洞攀岩資料庫" />
    <meta property="og:title" content="龍洞攀岩資料庫" />
    <meta property="og:description" content="龍洞攀岩路線與 Bolt 資訊，離線可用。資料由臺灣戶外攀岩協會（TOCC）固定點更新計畫維護。" />
    <meta property="og:image" content="https://tocc-climbing.github.io/longdong/icons/icon-512.png" />
    <link rel="icon" href="./icons/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>龍洞攀岩資料庫</title>
    <script>
      // 外觀設定（淺色／深色）在畫面出現前套用，避免閃一下另一種顏色；與 src/theme.ts 相同
      try {
        var theme = localStorage.getItem('longdong.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
