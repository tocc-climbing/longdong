name: Tide sync

# 每週抓一次中央氣象署的潮汐預報（未來 1 個月）存成 public/data/tide.json；
# 有變動就開（或更新）`tide-sync` 分支的 PR 並啟用自動合併，CI 通過就合併，正式站跟著更新（deploy.yml）。
# 授權碼放在 CWA_API_KEY 這個 Environment。
on:
  schedule:
    # 每週一台灣時間 04:00
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: tide-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: CWA_API_KEY
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: tide-sync
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 抓潮汐預報
        run: npm run tide
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}

      - name: Open or update the tide-sync PR
        run: |
          if git diff --quiet public/data/tide.json; then
            echo "潮汐資料與 main 相同"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          TODAY=$(TZ=Asia/Taipei date +%Y-%m-%d)
          git commit -m "潮汐預報：中央氣象署（$TODAY）" -- public/data/tide.json
          # tide-sync 分支每次都從最新的 main 重建，只含一個資料 commit
          git push --force origin "$BRANCH"

          {
            echo "## 目的"
            echo "更新龍洞的潮汐預報（中央氣象署，$TODAY 起一個月）。"
            echo
            echo "## 驗證"
            echo "- 抓取程式已檢查地點、潮汐、時間格式，否則不會開這個 PR"
            echo "- CI 通過後自動合併"
          } > "$RUNNER_TEMP/pr-body.md"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "潮汐預報：中央氣象署（$TODAY）" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "潮汐預報：中央氣象署（$TODAY）" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
          gh pr merge "$BRANCH" --auto --squash

          # GITHUB_TOKEN 推送與開 PR 不會觸發 pull_request 事件，手動觸發 CI
          gh workflow run ci.yml --ref "$BRANCH"
