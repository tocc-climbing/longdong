name: Deploy

# main 只能經由 PR 合併；合併後 build 並部署到 Firebase Hosting（https://longdong.web.app/）。
# 舊網址 GitHub Pages（tocc-climbing.github.io/longdong）只放轉址頁 github-pages-redirect/。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 版號的最後一碼是提交數，需要完整的 git 歷史
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # 金鑰由專案管理者以 firebase init hosting:github 建立，存在 repo 的 Secrets
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_2803619783974357321 }}
          projectId: project-2803619783974357321
          channelId: live

      # 舊網址：轉址頁（舊的分享連結 route/… 由 404.html 轉到新網址的同一個路徑）
      - uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages-redirect

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
