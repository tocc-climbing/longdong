name: Deploy

# 開發版與正式版分開：
# - main（PR 合併的地方）→ 開發站 https://longdong-dev.web.app/
# - release（發布：把 release 快轉到 main 的同一個 commit）→ 正式站 https://longdong.web.app/，並打上版號標籤
# - 路線資料（public/data，每天從 Google Sheet 同步）合併到 main 後也直接更新正式站：
#   用 release 的程式加上 main 的最新資料建置，先用 release 程式的資料格式驗證，對不上就不更新並顯示警告。
# - 潮汐（中央氣象署，未來一個月）在建置時抓，不放進 repo；每週一重新部署兩個網站，潮汐跟著更新。
#   授權碼在 CWA_API_KEY 這個 Environment。
# 快速迭代期：一般程式碼 push 不部署；保留唯一例外：資料同步 PR 合併後，main 的資料更新自動部署。
# GitHub Actions 的一般部署與 release 發布仍由手動 workflow_dispatch 觸發。
on:
  workflow_dispatch:
  push:
    branches: [chatgpt-deploy, main]
    paths:
      - deploy-requests/dev.json
      - public/data/**

permissions:
  contents: read

jobs:
  validate-chatgpt-request:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.validate.outputs.deploy }}
      data_deploy: ${{ steps.validate.outputs.data_deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: 驗證開發站部署指令或資料同步提交
        id: validate
        run: |
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          echo "data_deploy=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            # 僅當這次 main 提交真的只更動路線資料時才自動部署，其他 commit 一律不部署
            changed="$(git diff --name-only HEAD^1 HEAD)"
            [ -n "$changed" ] || exit 0
            while IFS= read -r file; do
              case "$file" in public/data/*) ;; *) echo "包含非路線資料變更，跳過自動部署"; exit 0 ;; esac
            done <<< "$changed"
            echo "data_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          [ "$changed" = "deploy-requests/dev.json" ] || { echo "只允許變更開發站部署指令" >&2; exit 1; }
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync("deploy-requests/dev.json", "utf8"));
            if (r.environment !== "dev" || !["check", "deploy"].includes(r.action)) throw new Error("部署指令不合法");
            if (typeof r.requestedAt !== "string" || !r.requestedAt.length) throw new Error("缺少指令識別時間");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `deploy=${r.action === "deploy"}\n`);
          '
  dev:
    needs: validate-chatgpt-request
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') || (github.event_name == 'push' && github.ref_name == 'chatgpt-deploy' && needs.validate-chatgpt-request.outputs.deploy == 'true') || (github.event_name == 'push' && github.ref_name == 'main' && needs.validate-chatgpt-request.outputs.data_deploy == 'true')
    runs-on: ubuntu-latest
    environment: CWA_API_KEY
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # 版號的最後一碼是提交數，需要完整的 git 歷史
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 測試在 PR 的 CI 已經跑過（main 只接受通過 CI 的 PR），這裡直接建置部署

      # 分享圖片的字型（scripts/lib/ogImage.ts）
      - run: bash scripts/install-og-fonts.sh

      # 潮汐：抓不到時照樣部署（首頁顯示沒有今天的潮汐資料），在這次執行標出警告
      - name: 抓潮汐預報
        run: npm run tide || echo "::warning::潮汐預報抓取失敗，這次部署沒有潮汐資料"
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}

      # VITE_CHANNEL=dev：畫面上標示「開發版」、不讓搜尋引擎收錄
      # 平常一兩分鐘：卡住時 15 分鐘就停下來（逾時中止的步驟才留得下記錄）
      - run: npm run build
        timeout-minutes: 15
        env:
          VITE_CHANNEL: dev

      # firebase.json 的網站是正式站（longdong），部署開發版時換成 longdong-dev
      - run: jq '.hosting.site = "longdong-dev"' firebase.json > firebase.dev.json && mv firebase.dev.json firebase.json

      # 金鑰由專案管理者以 firebase init hosting:github 建立，存在 repo 的 Secrets
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_2803619783974357321 }}
          projectId: project-2803619783974357321
          channelId: live
          # 15.34.1 起部署前會查 Service Usage API，專案沒開這個 API 就 403；先固定在可用的版本
          firebaseToolsVersion: 15.34.0

  live:
    needs: validate-chatgpt-request
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == 'release') || (github.event_name == 'push' && github.ref_name == 'main' && needs.validate-chatgpt-request.outputs.data_deploy == 'true')
    runs-on: ubuntu-latest
    environment: CWA_API_KEY
    permissions:
      contents: write # 發布時打版號標籤
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release
          fetch-depth: 0

      # main 的推送：只有路線資料和正式版不同時才更新正式站；每週排程與手動執行一律更新（潮汐）
      - name: 加入 main 的最新路線資料
        id: data
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            git checkout "$GITHUB_SHA" -- public/data
            if [ "$GITHUB_EVENT_NAME" = push ] && git diff --cached --quiet -- public/data; then
              echo "路線資料與正式版相同，正式站不用更新"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "路線資料有更新，用正式版的程式加上新資料部署正式站"
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - if: steps.data.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.data.outputs.deploy == 'true'
        run: npm ci

      # 新資料要符合正式版程式的資料格式（main 改了格式時，資料要等發布才能上正式站）
      - name: 驗證路線資料
        if: steps.data.outputs.deploy == 'true' && github.ref_name == 'main'
        run: |
          if ! npx tsx scripts/validate-data.ts; then
            echo "::warning::main 的路線資料不符合正式版程式的資料格式，正式站這次不更新；發布後就會一起上線"
            exit 1
          fi

      - if: steps.data.outputs.deploy == 'true'
        run: npm test

      # 分享圖片的字型；正式版的程式還沒有分享圖片時（發布前）沒有這支腳本，跳過
      - if: steps.data.outputs.deploy == 'true'
        run: if [ -f scripts/install-og-fonts.sh ]; then bash scripts/install-og-fonts.sh; fi

      # 潮汐；正式版的程式還沒有潮汐時（發布前）沒有這支腳本，跳過。抓不到時照樣部署並標出警告
      - name: 抓潮汐預報
        if: steps.data.outputs.deploy == 'true'
        run: |
          if [ -f scripts/fetch-tide.ts ]; then
            npm run tide || echo "::warning::潮汐預報抓取失敗，這次部署沒有潮汐資料"
          fi
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}

      - if: steps.data.outputs.deploy == 'true'
        run: npm run build
        timeout-minutes: 15

      - if: steps.data.outputs.deploy == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_2803619783974357321 }}
          projectId: project-2803619783974357321
          channelId: live
          # 15.34.1 起部署前會查 Service Usage API，專案沒開這個 API 就 403；先固定在可用的版本
          firebaseToolsVersion: 15.34.0

      # 手動發布正式版時打版號標籤
      - name: 版號標籤
        if: steps.data.outputs.deploy == 'true' && github.ref_name == 'release'
        run: |
          VERSION=$(npx tsx scripts/print-version.ts)
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "v$VERSION 已存在"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
