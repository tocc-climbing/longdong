name: CI

# PR 的必要檢查（main 的保護規則要求 `ci` 通過才能合併）。
# workflow_dispatch：每日資料同步以 GITHUB_TOKEN 開的 PR 不會觸發 pull_request 事件，
# 由同步流程在開完 PR 後以 workflow_dispatch 觸發，結果同樣掛在 PR 的 commit 上。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
