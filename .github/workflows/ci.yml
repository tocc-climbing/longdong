name: CI

# PR 的必要檢查（main 的保護規則要求 `ci` 通過才能合併）。
# workflow_dispatch：每日資料同步以 GITHUB_TOKEN 開的 PR 不會觸發 pull_request 事件，
# 由同步流程在開完 PR 後以 workflow_dispatch 觸發，結果同樣掛在 PR 的 commit 上。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 版號的最後一碼是提交數，需要完整的 git 歷史
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 這次改了哪些地方：沒改到的部分跳過較慢的檢查（每日資料同步等手動觸發的一律全跑）
      - name: 改動範圍
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          else
            files=ALL
          fi
          echo "$files"
          has() { [ "$files" = ALL ] || echo "$files" | grep -qE "$1"; }
          # 資料庫規則測試：規則、規則測試，或讀寫資料庫的程式
          if has '^(firebase/|firebase\.json|tests/rules/|src/personal/|src/social/|src/map/calibration|package(-lock)?\.json)'; then echo rules=true; else echo rules=false; fi >> "$GITHUB_OUTPUT"
          # 文字溢出檢查：畫面、文字、路線資料（新的長名稱）
          if has '^(src/|public/|index\.html|vite\.config|scripts/check-text-overflow|package(-lock)?\.json)'; then echo text=true; else echo text=false; fi >> "$GITHUB_OUTPUT"

      - run: npm run typecheck

      - run: npm test

      # 資料庫規則測試：Database 模擬器需要 Java
      - if: steps.changed.outputs.rules == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - if: steps.changed.outputs.rules == 'true'
        run: npm run test:rules

      # 分享圖片的字型（scripts/lib/ogImage.ts）
      - run: bash scripts/install-og-fonts.sh

      # 分享圖片只畫幾張，確認畫得出來（部署時才畫全部）
      - run: npm run build
        env:
          OG_IMAGE_LIMIT: 5

      # 各語言的文字有沒有超出元件（用 runner 內建的 Chrome 打開 production build）
      - if: steps.changed.outputs.text == 'true'
        run: npm run check:text
        env:
          BROWSER_CHANNEL: chrome
