<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>龍洞攀岩資料庫已搬家</title>
    <link rel="canonical" href="https://longdong.web.app/" />
    <!--
      舊網址 tocc-climbing.github.io/longdong 已搬到 https://longdong.web.app/。
      GitHub Pages 不能設定伺服器轉址，所以用這頁轉：保留路徑、查詢字串與 #（例如 #/route/...）。
      404.html 與這頁相同，處理其他路徑。
    -->
    <script>
      var path = location.pathname.replace(/^\/longdong\/?/, '').replace(/(^|\/)index\.html$/, '$1')
      location.replace('https://longdong.web.app/' + path + location.search + location.hash)
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=https://longdong.web.app/" /></noscript>
  </head>
  <body style="font-family: system-ui, sans-serif; text-align: center; padding: 48px 16px">
    <p>龍洞攀岩資料庫已搬到新網址：</p>
    <p><a href="https://longdong.web.app/">https://longdong.web.app/</a></p>
  </body>
</html>
